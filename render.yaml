services:
  - type: web
    name: securevote-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: securevote-data
      mountPath: /var/data/securevote
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOW_DEV_OTP
        value: "false"
      - key: SHOW_LIVE_RESULTS
        value: "false"
      - key: DATA_DIR
        value: /var/data/securevote
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: BALLOT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: SecureVote
